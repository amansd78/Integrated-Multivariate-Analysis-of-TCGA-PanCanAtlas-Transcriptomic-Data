[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stat662-tcga-pancan"
version = "0.1.0"
description = "STAT 662 TCGA PanCanAtlas multivariate analysis pipeline."
requires-python = ">=3.10"
dependencies = [
  "joblib>=1.3",
  "matplotlib>=3.7",
  "mizani>=0.11",
  "numpy>=1.24",
  "openpyxl>=3.1",
  "pandas>=2.0",
  "plotnine>=0.13",
  "pyarrow>=14.0",
  "scikit-learn>=1.3",
  "scipy>=1.11",
  "tqdm>=4.66",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
